  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  set $railway_origin_ok "no";
  if ($railway_origin_host = "-") {
    set $railway_origin_ok "yes";
  }
  if ($railway_origin_host = $host) {
    set $railway_origin_ok "yes";
  }
  if ($railway_origin_ok = "no") {
    return 403;
  }
  location = /healthz {
    auth_basic off;
    access_log off;
    limit_except GET {
      deny all;
    }
    proxy_pass http://127.0.0.1:CWSSUBFOLDERapi/health;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
  }
